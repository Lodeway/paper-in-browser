<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A real Paper Minecraft server running inside this browser tab: Paper 26.2 rewritten to Java 8 bytecode, executed by CheerpJ, joinable by real Minecraft clients through a WebSocket tunnel. A Lodeway Labs experiment."
    />
    <title>Paper in the browser: a Minecraft server in a tab · Lodeway Labs</title>
    <link rel="canonical" href="https://paper.labs.lodeway.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lodeway Labs" />
    <meta property="og:title" content="Paper in the browser: a Minecraft server in a tab" />
    <meta
      property="og:description"
      content="Paper 26.2 rewritten to Java 8 bytecode and executed by CheerpJ, joinable by real Minecraft clients through a WebSocket tunnel."
    />
    <meta property="og:url" content="https://paper.labs.lodeway.app/" />
    <meta property="og:image" content="https://paper.labs.lodeway.app/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="The page's header: run an extremely slow Minecraft server from your browser tab, above a minted server address."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paper in the browser: a Minecraft server in a tab" />
    <meta
      name="twitter:description"
      content="Paper 26.2 rewritten to Java 8 bytecode and executed by CheerpJ, joinable by real Minecraft clients through a WebSocket tunnel."
    />
    <meta name="twitter:image" content="https://paper.labs.lodeway.app/og.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191613" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Paper in the browser",
        "url": "https://paper.labs.lodeway.app/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "description": "A Paper Minecraft server running inside a browser tab, executed by CheerpJ.",
        "publisher": { "@type": "Organization", "name": "Lodeway Labs", "url": "https://lodeway.app/" }
      }
    </script>
    <link rel="stylesheet" href="../styles/globals.css" />
    <!-- The header is sticky: anchored sections must stop short of it. -->
    <style>
      [id]:not(body) {
        scroll-margin-top: 6rem;
      }
    </style>
    <!-- Theme before first paint, so a dark-preference visitor never sees a white flash. -->
    <script>
      try {
        var t = localStorage.getItem("paper-labs.theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
